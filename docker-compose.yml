services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fashion_search_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashion_search}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fashion_search"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
